backend:
  name: git-gateway
  branch: main

media_folder: public/images/blog
public_folder: /images/blog

locale: ko

collections:
  - name: blog
    label: 매거진 글
    label_singular: 글
    folder: src/content/blog
    create: true
    delete: true
    slug: "{{fields.slug}}"
    fields:
      - { name: title, label: 제목, widget: string }
      - name: slug
        label: "URL 주소 (영문 소문자, 띄어쓰기는 - 로)"
        hint: "예: jeju-yeonse → jejulabs.com/blog/jeju-yeonse · 발행 후에는 바꾸지 마세요"
        widget: string
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', '영문 소문자, 숫자, 하이픈(-)만 쓸 수 있어요']
      - { name: description, label: 요약 (카드에 표시됨), widget: text }
      - name: date
        label: 발행일
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - name: category
        label: 카테고리
        widget: select
        options:
          - { label: "사람", value: "people" }
          - { label: "사물", value: "object" }
          - { label: "문화", value: "culture" }
          - { label: "재해석", value: "reinterpret" }
          - { label: "공지", value: "notice" }

      - name: thumbnail
        label: 썸네일 이미지
        widget: image
        required: false
      - { name: author, label: 작성자, widget: string, default: "JEJULABS" }
      - { name: draft, label: 임시저장 (체크 시 비공개), widget: boolean, default: false }
      - { name: body, label: 본문, widget: markdown }
